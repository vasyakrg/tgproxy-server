# tgproxy server — прод-шаблон (/etc/tgproxy/server.yaml, root:tgproxy 0640).
# Схема: internal/config/config.go. Проверка:
#   tgproxy config validate --mode server -c /etc/tgproxy/server.yaml
# Пакет НЕ перезаписывает этот файл при обновлении (conffile, noreplace).
#
# Перед первым запуском:
#   1. Укажите server.public_base_url и tls (сертификат/ключ или acme).
#   2. Создайте KEK (владелец tgproxy, 0400):
#        tgproxy pki kek-init --out /etc/tgproxy/kek && chown tgproxy:tgproxy /etc/tgproxy/kek
#   3. Создайте CA в БД (один раз, от имени tgproxy):
#        runuser -u tgproxy -- tgproxy pki init -c /etc/tgproxy/server.yaml
#   4. Создайте /etc/tgproxy/users_database.yml (root:tgproxy 0640, хеш: `tgproxy hashpw`); TOTP обязателен.
#   5. Добавьте хотя бы одно правило доступа (access_rules) — без правил прокси отвечает отказом всем.

server:
  # Публичный base URL прокси: показывается в UI «Доступ» (https).
  public_base_url: "https://tg.example.com"

# Порты >= 1024: юнит работает с пустым CapabilityBoundingSet. Для :443 добавьте drop-in
# (systemctl edit tgproxy-server):  [Service] AmbientCapabilities=CAP_NET_BIND_SERVICE
#                                             CapabilityBoundingSet=CAP_NET_BIND_SERVICE
listen:
  proxy: ":8443"                  # прокси для ботов (TLS на входе)
  admin: "127.0.0.1:8090"         # Web-UI + /api/v1 + /healthz — только loopback; наружу через reverse proxy
  metrics: "127.0.0.1:9090"       # /metrics; не-loopback требует metrics.bearer_file
  agent_gateway: ":8444"          # reverse-соединения агентов (mTLS) и /enroll

tls:
  mode: files                     # off | files | acme
  cert_file: /etc/tgproxy/tls/server.crt   # ПЛЕЙСХОЛДЕР: положите свой сертификат
  key_file: /etc/tgproxy/tls/server.key    # ПЛЕЙСХОЛДЕР: права 0600/0640 (root:tgproxy)

# Встроенный CA для mTLS server <-> agent хранится в БД, ключ CA шифруется KEK (`tgproxy pki init`).
pki:
  dir: /var/lib/tgproxy/pki
  kek_file: /etc/tgproxy/kek

auth:
  users_file: /etc/tgproxy/users_database.yml   # формат Authelia, 0640 root:tgproxy; TOTP обязателен

store:
  driver: sqlite
  sqlite_path: /var/lib/tgproxy/tgproxy.db

update:
  enabled: true
  repo: vasyakrg/tgproxy-server
  staging_dir: /var/lib/tgproxy/updates
  # min_version: "0.1.0"          # даунгрейд ниже запрещён
  # http_proxy: http://proxy.internal:3128

# Токены Telegram-ботов приходят от клиентов в запросах и нигде не хранятся.
webhook_policy: deny              # deny | passthrough

# Агенты засеваются в БД только при пустых таблицах (первый старт); дальше — UI/CLI.
agents: []
# agents:
#   - id: eu-1
#     mode: dial                  # сервер сам подключается
#     url: https://203.0.113.10:8443
#   - id: nat-1
#     mode: reverse               # агент подключается к agent_gateway

# Подходящее хотя бы одно правило пропускает запрос. Без правил доступ закрыт (не open relay).
# Правило без сетей и без ключа, а также 0.0.0.0/0 без ключа — ошибка валидации.
access_rules: []
# access_rules:
#   - name: office                # только сеть: /bot<token>/<method>
#     cidrs: [203.0.113.0/24]
#     rps: 50
#   - name: ci-key                # только ключ: /k/<ключ>/bot<token>/<method>
#     key_sha256: "<sha256 hex ключа; получить: printf '%s' \"$KEY\" | sha256sum>"
#   - name: backend               # ключ из файла (хешируется при загрузке)
#     key_file: /etc/tgproxy/keys/backend.key   # 0640 root:tgproxy, не короче 16 символов

# Встроенный fail2ban: IP, набравший threshold отказов доступа за window, банится (403 до проверки
# правил и обращения к агентам). Считаются причины no_rule | key_required | bad_key; rate_limited и
# banned — нет. IPv4 банится по /32, IPv6 — по /64. Повторный бан того же адреса длится дольше:
# duration -> escalation[0] -> escalation[1] ... (последний шаг повторяется); уровень обнуляется
# через reset_after без нарушений. Никогда не банятся: trusted_proxies, адреса агентов, сети из
# правил доступа, loopback и приватные адреса. Ручные баны: UI «Баны», API /api/v1/bans, `tgproxy ban`.
# Если сервер стоит за reverse proxy — обязательно задайте trusted_proxies (иначе клиентом будет
# адрес прокси, а он защищён от бана).
ban:
  enabled: true
  threshold: 20
  window: 10m
  duration: 1h
  escalation: [24h, 168h]         # 24h, затем 7d
  reset_after: 720h               # 30d без нарушений — эскалация с нуля
  max_tracked: 10000              # потолок отслеживаемых IP в памяти (LRU)

# Страна клиента (флаг в «Ошибках» и «Банах»): локальная база DB-IP «IP to Country Lite» (CC BY 4.0,
# https://db-ip.com), кладётся deb-пакетом. Нет файла — флаги просто не показываются, сервер работает.
geoip:
  file: /usr/share/tgproxy/geoip/dbip-country-lite.mmdb

# MTProto-прокси для клиентов Telegram (FakeTLS, beta; docs/mtproto.md). По умолчанию выключен.
# Включение: раскомментируйте блок, задайте fronting_domain и перезапустите сервер
# (enabled, listen и fronting_domain применяются только при старте; остальное — по SIGHUP).
# Требует pki.kek_file (секреты шифруются KEK) и tls.mode files|acme при listen: shared.
# На время работы нужны точные часы (NTP/chrony): расхождение больше time_skew ломает рукопожатие.
# Рекомендуется отдельный IP/порт (listen: host:port) — MTProto на общем :443 с Bot API заметнее для DPI.
# mtproto:
#   enabled: false
#   listen: shared                # shared — листенер listen.proxy | host:port — выделенный
#   # public_host: tg.example.com # хост в ссылке; пусто — хост server.public_base_url
#   # public_port: 0              # порт в ссылке; 0 — порт листенера
#   fronting_domain: ""           # обязателен при enabled: домен ВХОДНОГО сертификата (tls.*)
#   max_conns: 20000
#   max_conns_per_ip: 64
#   max_pending_handshakes: 1024
#   handshake_timeout: 5s
#   idle_timeout: 5m
#   time_skew: 2m                 # допустимое расхождение часов клиента (30s..10m)
#   replay_cache: 4MiB            # анти-replay (1MiB..256MiB)
#   agent_pool:
#     max_reverse_conns: 16       # потолок; согласуйте с agent.mtproto.reverse_conns_max
#     max_streams_per_conn: 500
#     dial_timeout: 5s

# Алерты в Telegram (опционально): файл с токеном бота-уведомителя, 0640 root:tgproxy.
# notify:
#   bot_token_file: /etc/tgproxy/notify-token

logging:
  level: info
  format: json                    # journald: journalctl -u tgproxy-server -o cat
