version: 2

project_name: tgproxy

builds:
  - id: tgproxy
    main: ./cmd/tgproxy
    binary: tgproxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/vasyakrg/tgproxy-server/internal/buildinfo.Version={{.Version}}
      - -X github.com/vasyakrg/tgproxy-server/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/vasyakrg/tgproxy-server/internal/buildinfo.Date={{.CommitDate}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - id: tgproxy
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

