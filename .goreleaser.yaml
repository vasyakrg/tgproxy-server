version: 2

project_name: tgproxy

# База стран для deb: DB-IP «IP to Country Lite» (CC BY 4.0). В git не хранится — скачивается при
# сборке релиза и проверяется (scripts/geoip/fetch.sh). Без сети сборка падает осознанно: пакет без
# базы потерял бы флаги стран. Локально можно подложить файл вручную: build/geoip/dbip-country-lite.mmdb.
before:
  hooks:
    - sh -c 'test -s build/geoip/dbip-country-lite.mmdb || scripts/geoip/fetch.sh build/geoip/dbip-country-lite.mmdb'

builds:
  - id: tgproxy
    main: ./cmd/tgproxy
    binary: tgproxy
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/vasyakrg/tgproxy-server/internal/buildinfo.Version={{.Version}}
      - -X github.com/vasyakrg/tgproxy-server/internal/buildinfo.Commit={{.ShortCommit}}
      - -X github.com/vasyakrg/tgproxy-server/internal/buildinfo.Date={{.CommitDate}}
      # Доверенные minisign-ключи (base64, через запятую) вшиваются в бинарь: по ним
      # deploy-helper и `update apply` проверяют релизы. Релиз: из packaging/minisign.pub
      # (release.yml), dev: ключ dev/data (make dev-packages). Не задано — заглушка fail-closed.
      - '{{ if index .Env "TGPROXY_PUBKEYS" }}-X github.com/vasyakrg/tgproxy-server/internal/release.pubKeysCSV={{ index .Env "TGPROXY_PUBKEYS" }}{{ end }}'
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - id: tgproxy
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"


nfpms:
  - id: tgproxy-deb
    package_name: tgproxy
    ids: [tgproxy]
    formats: [deb]
    vendor: tgproxy
    maintainer: "vasyakrg <vasyakrg@gmail.com>"
    homepage: https://github.com/vasyakrg/tgproxy-server
    description: Telegram Bot API proxy (server and agent in one binary)
    section: net
    priority: optional
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    bindir: /usr/bin
    dependencies:
      - ca-certificates
    recommends: []
    contents:
      # Юниты (hardening — docs/architecture.md §8)
      - src: packaging/systemd/tgproxy-server.service
        dst: /lib/systemd/system/tgproxy-server.service
        file_info: {mode: 0644}
      - src: packaging/systemd/tgproxy-agent.service
        dst: /lib/systemd/system/tgproxy-agent.service
        file_info: {mode: 0644}
      - src: packaging/systemd/tgproxy-update-server.path
        dst: /lib/systemd/system/tgproxy-update-server.path
        file_info: {mode: 0644}
      - src: packaging/systemd/tgproxy-update-server.service
        dst: /lib/systemd/system/tgproxy-update-server.service
        file_info: {mode: 0644}
      - src: packaging/systemd/tgproxy-update-agent.path
        dst: /lib/systemd/system/tgproxy-update-agent.path
        file_info: {mode: 0644}
      - src: packaging/systemd/tgproxy-update-agent.service
        dst: /lib/systemd/system/tgproxy-update-agent.service
        file_info: {mode: 0644}
      # Конфиги: dpkg спрашивает/сохраняет локальные правки при upgrade
      - dst: /etc/tgproxy
        type: dir
        file_info: {mode: 0750, owner: root, group: tgproxy}
      - src: packaging/etc/server.yaml
        dst: /etc/tgproxy/server.yaml
        type: config|noreplace
        file_info: {mode: 0640, owner: root, group: tgproxy}
      - src: packaging/etc/agent.yaml
        dst: /etc/tgproxy/agent.yaml
        type: config|noreplace
        file_info: {mode: 0640, owner: root, group: tgproxy}
      # GeoIP: DB-IP Lite (CC BY 4.0, атрибуция «IP Geolocation by DB-IP» — в UI и README)
      - src: build/geoip/dbip-country-lite.mmdb
        dst: /usr/share/tgproxy/geoip/dbip-country-lite.mmdb
        file_info: {mode: 0644}
      # Лицензии сторонних компонентов (mtg и др.)
      - src: NOTICE
        dst: /usr/share/doc/tgproxy/NOTICE
        file_info: {mode: 0644}
      # Данные
      - dst: /var/lib/tgproxy
        type: dir
        file_info: {mode: 0750, owner: tgproxy, group: tgproxy}
    scripts:
      preinstall: packaging/scripts/preinst.sh
      postinstall: packaging/scripts/postinst.sh
      preremove: packaging/scripts/prerm.sh
      postremove: packaging/scripts/postrm.sh

# Подпись checksums.txt (minisign). Ключ — файл по пути из MINISIGN_KEY_FILE, пароль — из
# MINISIGN_PASSWORD через stdin (не попадает в argv/логи). Локально и в CI-проверках
# (goreleaser-check, deb-smoke, make snapshot/deb/release-dry) подпись отключается --skip=sign.
signs:
  - id: minisign
    artifacts: checksum
    cmd: minisign
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -m
      - "${artifact}"
      - -x
      - "${signature}"
    signature: "${artifact}.minisig"
    stdin: "{{ .Env.MINISIGN_PASSWORD }}\n"
