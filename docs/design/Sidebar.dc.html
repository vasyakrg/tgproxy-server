<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["Main.dc.html","Agents.dc.html","ClientKeys.dc.html","Errors.dc.html","System.dc.html"],"default":"Main.dc.html"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { collapsed: false }; }
  componentDidMount() {
    try {
      if (window.localStorage.getItem('tgproxy.sidebar.collapsed') === '1') this.setState({ collapsed: true });
    } catch (e) {}
  }
  renderVals() {
    const cur = this.props.current ?? 'Main.dc.html';
    const open = !this.state.collapsed;
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px;';
    const idle = base + ' color: #C3C9D4;';
    const active = base + ' color: #5EEAD4; background: #1B2A2A; font-weight: 500;';
    const map = { main: 'Main.dc.html', agents: 'Agents.dc.html', access: 'ClientKeys.dc.html', errors: 'Errors.dc.html', system: 'System.dc.html' };
    const st = {}, curAttr = {};
    Object.keys(map).forEach((k) => {
      st[k] = map[k] === cur ? active : idle;
      curAttr[k] = map[k] === cur ? 'page' : 'false';
    });
    return {
      open, st, cur: curAttr,
      width: open ? '232px' : '68px',
      toggleLabel: open ? 'Свернуть меню' : 'Развернуть меню',
      toggle: () => {
        const collapsed = !this.state.collapsed;
        this.setState({ collapsed });
        try { window.localStorage.setItem('tgproxy.sidebar.collapsed', collapsed ? '1' : '0'); } catch (e) {}
      }
    };
  }
}
</script>
