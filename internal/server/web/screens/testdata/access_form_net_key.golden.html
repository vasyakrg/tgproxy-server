<form class="stack rule-form" method="post" action="/access" hx-post="/access" hx-target="#rule-modal-body" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]" novalidate><h3 class="form-title">Новое правило</h3><div class="field"><label class="field-label" for="rule-name">Название</label> <input class="input" id="rule-name" name="name" type="text" value="" required aria-describedby="rule-name-hint" autocomplete="off" maxlength="64" spellcheck="false"> <div class="field-hint" id="rule-name-hint">Латиница, цифры, «.», «_», «-»</div></div><div class="field"><label class="field-label" for="rule-cidrs">Сети, CIDR по одному в строке (пусто — любые, но тогда нужен ключ)</label> <textarea class="textarea mono" id="rule-cidrs" name="cidrs" rows="3" spellcheck="false" placeholder="10.20.0.0/16">10.20.0.0/16</textarea> </div><label class="check"><input type="checkbox" id="rule-with-key" name="with_key" value="1" checked> <span>Скрытый ключ в адресе</span></label><p class="field-hint key-hint" id="rule-key-hint" role="note" data-active>Сеть И ключ: запросы из этих сетей без ключа будут отклонены (403)</p><div class="field"><label class="field-label" for="rule-rps">Лимит, запросов/с</label> <input class="input" id="rule-rps" name="rps" type="text" value="" aria-describedby="rule-rps-hint" autocomplete="off" inputmode="decimal" maxlength="10"> <div class="field-hint" id="rule-rps-hint">0 или пусто — без лимита</div></div><p class="form-note">Правило без сетей и без ключа не создаётся: это открытый прокси, за который Telegram банит IP агентов.</p><div class="form-actions"><button type="button" class="btn" data-modal-close>Отмена</button> <button type="submit" class="btn btn-primary">Создать правило</button></div></form>
