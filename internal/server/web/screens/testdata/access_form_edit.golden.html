<form class="stack" method="post" action="/access/2" hx-post="/access/2" hx-target="#rule-modal-body" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]" novalidate><h3 class="form-title">Изменить правило</h3><div class="field"><label class="field-label" for="rule-name">Название</label> <input class="input" id="rule-name" name="name" type="text" value="crm" required aria-describedby="rule-name-hint" autocomplete="off" maxlength="64" spellcheck="false"> <div class="field-hint" id="rule-name-hint">Латиница, цифры, «.», «_», «-»</div></div><div class="field"><label class="field-label" for="rule-cidrs">Сети, CIDR по одному в строке (пусто — любые, но тогда нужен ключ)</label> <textarea class="textarea mono" id="rule-cidrs" name="cidrs" rows="3" spellcheck="false" placeholder="10.20.0.0/16"></textarea> </div><div class="field"><span class="field-label">Скрытый ключ</span> <span class="mono">tgp_k7Qm…</span> <span class="field-hint">Ключ изменить нельзя: создайте новое правило и удалите это.</span></div><div class="field"><label class="field-label" for="rule-rps">Лимит, запросов/с</label> <input class="input" id="rule-rps" name="rps" type="text" value="30" aria-describedby="rule-rps-hint" autocomplete="off" inputmode="decimal" maxlength="10"> <div class="field-hint" id="rule-rps-hint">0 или пусто — без лимита</div></div><label class="check"><input type="checkbox" name="enabled" value="1" checked> <span>Правило включено</span></label><p class="form-note">Правило без сетей и без ключа не создаётся: это открытый прокси, за который Telegram банит IP агентов.</p><div class="form-actions"><button type="button" class="btn" data-modal-close>Отмена</button> <button type="submit" class="btn btn-primary">Сохранить</button></div></form>
