<form class="stack" method="post" action="/bans" hx-post="/bans" hx-target="#ban-modal-body" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]" novalidate><h3 class="form-title">Забанить IP</h3><input type="hidden" name="from" value="bans"> <div class="field field-invalid"><label class="field-label" for="ban-ip">IP-адрес</label> <input class="input" id="ban-ip" name="ip" type="text" value="10.1.2.3" required aria-invalid="true" aria-describedby="ban-ip-hint ban-ip-error" autocomplete="off" maxlength="45" spellcheck="false"> <div class="field-hint" id="ban-ip-hint">IPv4 банится целиком, IPv6 — сетью /64</div><div class="field-error" id="ban-ip-error" role="alert">Этот адрес банить нельзя: приватный адрес</div></div><div class="field"><label class="field-label" for="ban-duration">Срок</label> <select class="select" id="ban-duration" name="duration"><option value="1h" selected>1 час</option><option value="24h">24 часа</option><option value="7d">7 дней</option><option value="permanent">Навсегда</option></select> </div><div class="field"><label class="field-label" for="ban-comment">Комментарий</label> <input class="input" id="ban-comment" name="comment" type="text" value="" aria-describedby="ban-comment-hint" autocomplete="off" maxlength="200"> <div class="field-hint" id="ban-comment-hint">Необязательно, до 200 символов</div></div><p class="form-note">Свои адреса (доверенные прокси, агенты, сети правил доступа, приватные) банить нельзя: это заблокировало бы сам сервис.</p><div class="form-actions"><button type="button" class="btn" data-modal-close>Отмена</button> <button type="submit" class="btn btn-primary">Забанить</button></div></form>
