<form class="stack" method="post" action="/access" hx-post="/access" hx-target="#rule-modal-body" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]" novalidate><h3 class="form-title">Новое правило</h3><div class="field"><label class="field-label" for="rule-name">Название</label> <input class="input" id="rule-name" name="name" type="text" value="x" required aria-describedby="rule-name-hint" autocomplete="off" maxlength="64" spellcheck="false"> <div class="field-hint" id="rule-name-hint">Латиница, цифры, «.», «_», «-»</div></div><div class="field field-invalid"><label class="field-label" for="rule-cidrs">Сети, CIDR по одному в строке (пусто — любые, но тогда нужен ключ)</label> <textarea class="textarea mono" id="rule-cidrs" name="cidrs" rows="3" spellcheck="false" placeholder="10.20.0.0/16" aria-invalid="true" aria-describedby="rule-cidrs-error">0.0.0.0/0</textarea> <div class="field-error" id="rule-cidrs-error" role="alert">открытый прокси</div></div><label class="check"><input type="checkbox" name="with_key" value="1"> <span>Скрытый ключ в адресе</span></label><div class="field"><label class="field-label" for="rule-rps">Лимит, запросов/с</label> <input class="input" id="rule-rps" name="rps" type="text" value="" aria-describedby="rule-rps-hint" autocomplete="off" inputmode="decimal" maxlength="10"> <div class="field-hint" id="rule-rps-hint">0 или пусто — без лимита</div></div><p class="form-note">Правило без сетей и без ключа не создаётся: это открытый прокси, за который Telegram банит IP агентов.</p><div class="form-actions"><button type="button" class="btn" data-modal-close>Отмена</button> <button type="submit" class="btn btn-primary">Создать правило</button></div></form>
