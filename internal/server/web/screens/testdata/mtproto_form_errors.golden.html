<form class="stack" method="post" action="/mtproto" hx-post="/mtproto" hx-target="#mt-modal-body" hx-swap="innerHTML" hx-disabled-elt="find button[type=submit]" novalidate><h3 class="form-title">Новый секрет</h3><div class="field field-invalid"><label class="field-label" for="mt-name">Название</label> <input class="input" id="mt-name" name="name" type="text" value="!!" required aria-invalid="true" aria-describedby="mt-name-hint mt-name-error" autocomplete="off" maxlength="64" spellcheck="false"> <div class="field-hint" id="mt-name-hint">Буквы, цифры, пробел, «.», «_», «-»</div><div class="field-error" id="mt-name-error" role="alert">Буквы, цифры</div></div><div class="field"><label class="field-label" for="mt-cidrs">Сети клиентов, CIDR по одному в строке (пусто — любые)</label> <textarea class="textarea mono" id="mt-cidrs" name="cidrs" rows="3" spellcheck="false" placeholder="203.0.113.0/24"></textarea> </div><div class="field field-invalid"><label class="field-label" for="mt-max-conns">Лимит соединений</label> <input class="input" id="mt-max-conns" name="max_conns" type="text" value="x" aria-invalid="true" aria-describedby="mt-max-conns-hint mt-max-conns-error" autocomplete="off" inputmode="numeric" maxlength="7"> <div class="field-hint" id="mt-max-conns-hint">0 или пусто — без лимита</div><div class="field-error" id="mt-max-conns-error" role="alert">Целое число</div></div><p class="form-note">Ссылка и QR будут показаны один раз сразу после создания. Позже их можно открыть повторно по коду TOTP.</p><div class="form-actions"><button type="button" class="btn" data-modal-close>Отмена</button> <button type="submit" class="btn btn-primary">Создать секрет</button></div></form>
