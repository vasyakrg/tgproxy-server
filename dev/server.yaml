# Черновой dev-конфиг server. Схема уточняется в M1-T1.
listen:
  proxy: ":8080"              # прокси для ботов
  admin: "127.0.0.1:8090"     # Web-UI + /api/v1 + /healthz
  metrics: ":9090"            # /metrics (bearer)
  agent_gateway: ":8444"      # reverse-соединения агентов (mTLS), /enroll

tls:
  mode: "off"                 # off | files | acme; для dev — off
  cert_file: ./dev/tls/server.crt
  key_file: ./dev/tls/server.key

storage:
  driver: sqlite              # sqlite | redis (только эфемерное)
  sqlite_path: ./dev/data/tgproxy.db
  # redis_url: rediss://tgproxy:dev-redis-password@127.0.0.1:6380/0

pki:
  dir: ./dev/tls
  kek_file: ./dev/data/kek

auth:
  users_file: ./dev/users.yml

agents:
  - id: local
    url: https://127.0.0.1:8443

access_rules:
  - name: localhost
    type: network
    cidr: 127.0.0.0/8
    action: allow

logging:
  level: debug
  format: text
