# Dev-конфиг server (macOS, всё на 127.0.0.1). Схема: internal/config/config.go.
# Проверка: tgproxy config validate --mode server -c dev/server.yaml
server:
  # Публичный base URL прокси: подставляется в UI «Доступ» (https; http — только loopback).
  public_base_url: "http://127.0.0.1:8080"
  # URL agent_gateway ГЛАЗАМИ АГЕНТОВ: его печатает команда enrollment и по нему dial-агенты в контейнерах
  # (sshd-debian, nat-agent) качают релизы при раскатке. Нужен только им: агенты-процессы на хосте
  # либо dial без обновлений, либо reverse со своим server_url. Сертификат gateway проверяется по CA
  # и SAN server, не по имени хоста, поэтому host.docker.internal подходит.
  agent_gateway_url: "https://host.docker.internal:8444"

listen:
  proxy: "127.0.0.1:8080"          # прокси для ботов
  admin: "127.0.0.1:8090"          # Web-UI + /api/v1 + /healthz
  metrics: "127.0.0.1:9090"        # /metrics (bearer не нужен только на loopback)
  agent_gateway: "127.0.0.1:8444"  # reverse-соединения агентов (mTLS), /enroll

tls:
  mode: "off"                      # off | files | acme; в dev TLS на входе нет (loopback)

# agent_tls не задан: сервер берёт CA из БД под KEK (`make dev-setup` = kek-init + pki init) и сам
# выпускает себе mTLS-сертификат; agent_gateway (:8444) принимает reverse-агентов и /enroll.
# URL gateway для команды enrollment и раскатки: server.agent_gateway_url.
pki:
  kek_file: ./dev/data/kek

auth:
  users_file: ./dev/users.yml     # права не шире 0640 (`make dev-setup`)
  # ТОЛЬКО DEV; в проде TOTP обязателен. Включение TOTP: см. dev/README.md («Веб-UI»).
  allow_password_only: true

store:
  driver: sqlite                   # sqlite | redis (redis — только rediss://)
  sqlite_path: ./dev/data/tgproxy.db
  # driver: redis
  # redis_url: rediss://tgproxy@127.0.0.1:6380/0
  # redis_password_file: ./dev/data/redis-password   # права 0600/0640
  # redis_ca_file: ./dev/tls/redis-ca.crt            # CA для rediss://; пусто — системные корни

update:
  enabled: false                   # в dev самообновление не нужно
  staging_dir: ./dev/data/updates
  downloads_dir: ./dev/data/packages   # подписанный dev-набор: make dev-packages (кэш установщика агентов)

# /metrics на loopback доступен без bearer; на не-loopback bearer обязателен (старт иначе откажет).
metrics:
  # bearer_file: ./dev/data/metrics-bearer   # 0600; тогда curl -H "Authorization: Bearer $(cat dev/data/metrics-bearer)"

# Алерты в Telegram (бот-уведомитель) — opt-in: раскомментируйте после создания файла с токеном
# (он НЕ в git, см. dev/README.md). Файл обязателен, если секция включена (конфиг иначе не загрузится,
# в т.ч. для CLI `tgproxy access/agents`). Получатели — telegram_id из auth.users_file (в dev/users.yml он 0).
# Без секции уведомления выключены (INFO в логе).
# notify:
#   bot_token_file: ./dev/data/notify-token

webhook_policy: deny               # deny | passthrough

agents:
  # Агенты и правила доступа засеваются в SQLite ТОЛЬКО при пустых таблицах (первый старт);
  # дальше источник правды — БД (`tgproxy access ...`, `tgproxy agents list`).
  # Чтобы пересеять из конфига: остановить сервер и удалить dev/data/tgproxy.db*.
  - id: local
    url: https://127.0.0.1:8443
    mode: dial
  - id: local2
    url: https://127.0.0.1:8445
    mode: dial

# Подходящее хотя бы одно правило пропускает запрос. См. dev/README.md.
access_rules:
  - name: localhost                # только сеть: /bot<token>/<method>
    cidrs: [127.0.0.0/8]
  - name: dev-key                  # только ключ: /k/tgp_devkey_local_only/bot<token>/<method>
    key_sha256: 5d920d4d62626d92a41b29c61d704f31857190681e0f521e08d22ce671082be7

logging:
  level: debug
  format: text
